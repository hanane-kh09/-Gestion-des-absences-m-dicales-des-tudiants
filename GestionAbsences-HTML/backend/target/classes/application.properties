spring.datasource.url=jdbc:mysql://localhost:3306/absences_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=AbsencesMedicalesSecretKeyLongueEtSecurisee2024JWTSpringBoot
